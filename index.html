    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="classes/background-object.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/chicken.class.js"></script>
    <script src="classes/chicken_small.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="classes/cloud.class.js"></script>
    <script src="classes/bottles.class.js"></script>
    <script src="classes/coin.class.js"></script>

    <script src="classes/status-bar.class.js"></script>

<body onload="initGame()">
    <h1>El pollo Loco</h1>

    <div onclick="enterfullScreen()" id="fullscreen" class="game-container">
        <canvas id="gameCanvas" width="720" height="480"></canvas>
        <button id="startButton" class="start-button" type="button" aria-label="Spiel starten">
            <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="El Pollo Loco – Spiel starten">
        </button>
    </div>

    <div class="description">
        <h2>Steuerung</h2>
        <p><strong>Pfeiltaste links/rechts:</strong> Character bewegen</p>
        <p><strong>Leertaste:</strong> Springen</p>
        <p><strong>Taste D:</strong> Flasche werfen</p>
        <button type="button" onclick="enterfullScreen()">Vollbild</button>
    </div>
</body>
</html>
